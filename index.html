<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    <!-- form: agrupa controles para enviar sus datos; action: indica dónde se envían; method: define cómo se envían -->
    <form action="index.html" method="get">
        <!-- fieldset: agrupa campos relacionados -->
        <fieldset>
            <!-- legend: da un título al grupo de campos -->
            <legend>Datos personales by Mario</legend>
            <!-- label: identifica un campo; for: asocia la etiqueta con el id del control -->
            <label for="nombre">Nombre:</label>
            <!-- input: permite introducir un dato; type: define el tipo de control; id: identifica el control; name: nombra el dato enviado -->
            <!-- text: permite escribir texto sin ocultarlo -->
            <!-- placeholder: muestra una pista cuando el campo está vacío; required: exige completar el campo -->
            <!-- autofocus: enfoca el campo al cargar la página; size: establece el ancho visible; maxlength: limita el número máximo de caracteres -->
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">

            <label for="contrasena">Contraseña:</label>
            <!-- password: oculta el texto escrito; minlength: establece el número mínimo de caracteres -->
            <input type="password" id="contrasena" name="contrasena" minlength="8">

            <label for="correo">Correo:</label>
            <!-- email: permite introducir una dirección de correo electrónico -->
            <input type="email" id="correo" name="correo" required>

            <label for="telefono">Teléfono:</label>
            <!-- tel: permite introducir un número de teléfono; pattern: define el formato que debe cumplir el valor -->
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">

            <label for="fecha-nacimiento">Fecha de nacimiento:</label>
            <!-- date: permite seleccionar una fecha -->
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">

            <label for="foto">Foto:</label>
            <!-- file: permite seleccionar un archivo -->
            <input type="file" id="foto" name="foto">

            <label for="curso">Curso:</label>
            <!-- value: establece el valor inicial del campo; readonly: impide editar el valor -->
            <input type="text" id="curso" name="curso" value="2026-27" readonly>

            <label for="centro">Centro:</label>
            <!-- disabled: desactiva el campo y evita que se envíe con el formulario -->
            <input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
        </fieldset>

        <fieldset>
            <legend>Preferencias</legend>
            <span>Turno:</span>
            <label for="turno-manana">Mañana</label>
            <!-- radio: permite elegir una opción de un grupo; value: define el valor enviado al elegir la opción -->
            <input type="radio" id="turno-manana" name="turno" value="manana">
            <label for="turno-tarde">Tarde</label>
            <input type="radio" id="turno-tarde" name="turno" value="tarde">

            <span>Intereses:</span>
            <label for="interes-deporte">Deporte</label>
            <!-- checkbox: permite marcar o desmarcar una opción independiente -->
            <input type="checkbox" id="interes-deporte" name="intereses" value="deporte">
            <label for="interes-lectura">Lectura</label>
            <input type="checkbox" id="interes-lectura" name="intereses" value="lectura">
            <label for="interes-musica">Música</label>
            <input type="checkbox" id="interes-musica" name="intereses" value="musica">
        </fieldset>
    </form>
</body>
</html>
